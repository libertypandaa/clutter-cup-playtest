<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clutter Cup — Audio Gallery</title><style>
:root{font-family:system-ui,sans-serif;color:#fff7df;background:#171512;color-scheme:dark}body{max-width:1060px;margin:auto;padding:28px}h1{margin-bottom:4px}p{color:#cfc5ae}section{margin:28px 0}h2{font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}button{min-height:56px;text-align:left;padding:10px 12px;border:1px solid #655c49;border-radius:12px;background:#29251e;color:inherit;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:#ffc45e;background:#3b3121}small{display:block;color:#bbae91;margin-top:4px}.bar{position:sticky;bottom:10px;display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#100f0de8;border:1px solid #514a3d}.bar button{min-height:40px}.bar output{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head><body>
<h1>Clutter Cup — Audio Gallery</h1><p>Релизные ресурсы читаются из того же манифеста, что и игра. Петли останавливаются кнопкой Stop; одноразовые события можно сравнивать подряд.</p><main id="gallery"></main><div class="bar"><button id="stop">■ Stop</button><output id="now">тишина</output></div>
<script type="module">const data=await fetch('./assets/presentation/audio-release.json').then(r=>r.json()),groups={"Приводы":/^drive\./,"Качение и среда":/^(roll|ambience)\./,"Материалы":/^impact\./,"Гараж и интерфейс":/^(ui|garage|shop)\./,"Гонка, груз и награды":/^(coin|bonus|lasso|race|rescue|box|achievement)\./,"Гонщики":/^voice\./,"Музыка":/^music\./},root=document.querySelector('#gallery'),now=document.querySelector('#now');let audio=null;const stop=()=>{audio?.pause();audio=null;document.querySelectorAll('button[aria-pressed=true]').forEach(b=>b.setAttribute('aria-pressed','false'));now.value='тишина'},play=(b,file,id,loop=false,volume=1)=>{stop();audio=new Audio(file);audio.loop=loop;audio.volume=volume;audio.play();b.setAttribute('aria-pressed','true');now.value=id};document.querySelector('#stop').onclick=stop;for(const [title,re] of Object.entries(groups)){const section=document.createElement('section'),grid=document.createElement('div');section.innerHTML=`<h2>${title}</h2>`;grid.className='grid';for(const [id,p] of Object.entries(data.audio).filter(([id])=>re.test(id))){const b=document.createElement('button');b.innerHTML=`${id}<small>${p.files.length} файл(а) · gain ${p.gain}${p.loop?' · loop':''}</small>`;b.onclick=()=>play(b,'./assets/presentation/'+p.files[0],id,!!p.loop,Math.min(1,p.gain*1.35));grid.append(b)}section.append(grid);root.append(section)}const section=document.createElement('section'),grid=document.createElement('div');section.innerHTML='<h2>Настоящий игровой микс</h2><p>Записи master bus во время автоматизированных заездов: idle → partial → full → coast → reverse → boost → detach.</p>';grid.className='grid';for(const drive of ['mixer','chainsaw','kettle','hamster']){const b=document.createElement('button');b.innerHTML=`mix.${drive}<small>WebAudio master · Opus 48 kHz stereo</small>`;b.onclick=()=>play(b,`./assets/presentation/audio/evidence/drive-mix-${drive}.ogg`,`mix.${drive}`);grid.append(b)}section.append(grid);root.prepend(section)</script></body></html>
