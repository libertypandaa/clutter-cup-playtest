<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clutter Cup iframe harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #181512; color: white; font-family: system-ui, sans-serif; }
      iframe { width: 100vw; height: 100dvh; border: 0; display: block; }
      #events { position: fixed; top: 12px; left: 12px; max-width: 360px; padding: 10px; border-radius: 8px; background: rgba(0,0,0,.62); font-size: 12px; z-index: 2; }
    </style>
  </head>
  <body>
    <details style="position:fixed;z-index:5;top:2px;right:2px"><summary>Hub events</summary><pre id="events">waiting...</pre></details>
    <iframe id="game" title="Clutter Cup P1" allow="fullscreen; autoplay; gamepad"></iframe>
    <script>
      const events = [];
      const out = document.querySelector('#events');
      window.addEventListener('message', (event) => {
        if (event.data && event.data.game === 'clutter-cup') {
          events.push(event.data);
          out.textContent = JSON.stringify(events, null, 2);
        }
      });
      document.querySelector('#game').src = './?' + (new URLSearchParams(location.search).has('test')?'test=1&':'') + 'hubOrigin=' + encodeURIComponent(location.origin);
    </script>
  </body>
</html>
